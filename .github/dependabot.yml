# Dependabot version updates: one PR per available dependency bump, checked weekly,
# for every package ecosystem found in this repo. GitHub's default 3-day cooldown
# on newly published versions applies. Managed org-wide by AppSec.
version: 2
updates:
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 100
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 100
