apiVersion: v1
kind: Namespace
metadata:
  name: csi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akeyless-csi-provider
  namespace: csi
---
# TokenRequest ClusterRole/Binding intentionally omitted: this provider does not
# call the TokenRequest API. Avoid granting cluster-wide minting if a pod SA
# token is ever exfiltrated. Audit the separately maintained Helm chart too.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: akeyless-csi-provider
  name: akeyless-csi-provider
  namespace: csi
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: akeyless-csi-provider
  template:
    metadata:
      labels:
        app: akeyless-csi-provider
    spec:
      serviceAccountName: akeyless-csi-provider
      tolerations:
      containers:
        - name: provider-akeyless-installer
          image: akeyless/akeyless-csi-drive-provider:latest
          imagePullPolicy: IfNotPresent
          args:
            - -endpoint=/provider/akeyless.sock
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 50m
              memory: 100Mi
          volumeMounts:
            - name: providervol
              mountPath: "/provider"
          livenessProbe:
            httpGet:
              path: "/health/ready"
              port: 8080
              scheme: "HTTP"
            failureThreshold: 2
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: "/health/ready"
              port: 8080
              scheme: "HTTP"
            failureThreshold: 2
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
      volumes:
        - name: providervol
          hostPath:
            path: "/etc/kubernetes/secrets-store-csi-providers"
      nodeSelector:
        kubernetes.io/os: linux
