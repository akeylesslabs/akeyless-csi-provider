# Example: Akeyless OAuth2.0/JWT authentication for the CSI provider.
#
# Create an Akeyless auth method that trusts your cluster OIDC JWKS, e.g.:
#   akeyless auth-method create oauth2 \
#     --name /k8s/cluster-oidc \
#     --jwks-uri https://oidc.eks.<region>.amazonaws.com/id/<ID>/keys \
#     --unique-identifier sub
#
# Bind sub-claims to the ServiceAccount that owns the JWT passed in
# nodePublishSecretRef (key akeylessJWT).
# Prefer short-lived projected ServiceAccount tokens over static JWTs.
#
# Token sources (first match wins):
#   1. CSI secret key "akeylessJWT" for this mount
#   2. Env AKEYLESS_JWT on the provider, only if this mount did not
#      set akeylessJWT (one identity for every such mount)
#
# Do NOT put the JWT in SecretProviderClass parameters (stored in etcd).
# Do NOT fall back to the provider ServiceAccount token.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: akeyless-jwt-example
spec:
  provider: akeyless
  parameters:
    akeylessGatewayURL: "https://api.akeyless.io"
    akeylessAccessID: "<oauth2/jwt auth-method access id>"
    akeylessAccessType: "jwt" # alias: oauth2
    objects: |
      - secretPath: "/full/path/to/secret/item"
        fileName: "local-secret-filename"
---
apiVersion: v1
kind: Pod
metadata:
  name: test-csi-jwt
spec:
  containers:
    - name: alpine
      image: alpine
      command: ["sh", "-c", "echo going to sleep... && sleep 10000"]
      volumeMounts:
        - name: secrets-store-inline
          mountPath: "/akeyless-secrets"
          readOnly: true
  volumes:
    - name: secrets-store-inline
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "akeyless-jwt-example"
        # JWT for this mount. Key must be "akeylessJWT".
        # Use a short-lived projected token for the workload ServiceAccount.
        nodePublishSecretRef:
          name: akeyless-jwt
