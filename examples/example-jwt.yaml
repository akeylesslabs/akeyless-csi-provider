# Example: Akeyless OAuth2.0/JWT authentication for the CSI provider.
#
# The JWT must be the workload pod's own ServiceAccount token, issued and
# rotated by kubelet. Do NOT put a static JWT in a Secret or DaemonSet env —
# those expire and are never refreshed.
#
# 1) Create an Akeyless OAuth2/JWT auth method that trusts the cluster OIDC JWKS:
#      akeyless auth-method create oauth2 \
#        --name /k8s/cluster-oidc \
#        --jwks-uri https://oidc.eks.<region>.amazonaws.com/id/<ID>/keys \
#        --unique-identifier sub
#    Bind Access Role sub-claims to the workload ServiceAccount (e.g. sub).
#
# 2) Configure tokenRequests on the secrets-store CSIDriver so kubelet mints
#    a token for your audience (must match akeylessJWTAudience below):
#
#      kubectl patch csidriver secrets-store.csi.k8s.io --type=merge -p '{
#        "spec": {
#          "tokenRequests": [{"audience":"akeyless.io","expirationSeconds":3600}],
#          "requiresRepublish": true
#        }
#      }'
#
#    Or with the driver Helm chart:
#      --set tokenRequests[0].audience=akeyless.io \
#      --set tokenRequests[0].expirationSeconds=3600 \
#      --set enableSecretRotation=true
#
# The CSI driver passes the token in csi.storage.k8s.io/serviceAccount.tokens
# on every mount/republish. The provider selects it by akeylessJWTAudience.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: akeyless-jwt-example
spec:
  provider: akeyless
  parameters:
    akeylessGatewayURL: "https://api.akeyless.io"
    akeylessAccessID: "<oauth2/jwt auth-method access id>"
    akeylessAccessType: "jwt" # alias: oauth2
    # Must match a CSIDriver tokenRequests audience.
    akeylessJWTAudience: "akeyless.io"
    objects: |
      - secretPath: "/full/path/to/secret/item"
        fileName: "local-secret-filename"
---
apiVersion: v1
kind: Pod
metadata:
  name: test-csi-jwt
spec:
  serviceAccountName: default
  containers:
    - name: alpine
      image: alpine
      command: ["sh", "-c", "echo going to sleep... && sleep 10000"]
      volumeMounts:
        - name: secrets-store-inline
          mountPath: "/akeyless-secrets"
          readOnly: true
  volumes:
    - name: secrets-store-inline
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "akeyless-jwt-example"
